[pad]

[hotkeys]

[padhotkeys]
# Keep guide as the modifier. On the pads with no FUNC key of their own the
# capability maps emit Guide from BTN_SELECT, so guide *is* the Select button:
# holding it runs the hotkeys, tapping it still reaches the DS. Naming "back"
# instead does not work there: DSperate sees the alias Guide event while the
# modifier is held, treats the press as "not alone", and never taps the DS
# Select out on release.
modifier = guide
quit = mod+start
pause = mod+x
fast_forward = mod+b
fast_forward_toggle = mod++righttrigger
save_state = mod+rightshoulder
load_state = mod+leftshoulder
slot_next = mod+dpright
slot_prev = mod+dpleft
layout_next = mod+dpup
layout_prev = mod+dpdown
screen_swap = mod++lefttrigger
mic = leftstick
fps = mod+y

[cheevos]
enabled = false
