[loader]

[video]
fullscreen = true
layout = horizontal
vsync = true

[audio]

[cart]

[emu]

[keys]

[pad]

[hotkeys]

[padhotkeys]
# These pads have no FUNC/guide key of their own (the capability maps alias
# BTN_SELECT to Guide for the frontend's sake, and the RK3566 handhelds used to
# carry a BTN_MODE nobody could press). L2 is the DS's for the taking: it has no
# trigger, so the modifier costs the console nothing.
modifier = +lefttrigger
quit = mod+start
pause = mod+x
fast_forward = mod+b
fast_forward_toggle = mod++righttrigger
save_state = mod+rightshoulder
load_state = mod+leftshoulder
slot_next = mod+dpright
slot_prev = mod+dpleft
layout_next = mod+dpup
layout_prev = mod+dpdown
screen_swap = mod+y
mic = leftstick
fps = mod+a

[cheevos]
enabled = false
