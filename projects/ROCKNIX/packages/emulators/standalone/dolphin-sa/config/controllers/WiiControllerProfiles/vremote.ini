[Wiimote1]
Device = SDL/0/@SDL_DEVICE@
Buttons/A = `Button S`
Buttons/B = `Button E`
Buttons/1 = `Button N`
Buttons/2 = `Button W`
Buttons/- = `Back`
Buttons/+ = `Start`
Buttons/Home = `Guide`
Shake/X = `Shoulder L`
Shake/Y = `Shoulder L`
Shake/Z = `Shoulder L`
D-Pad/Up = `Pad N` | `Left Y+`
D-Pad/Down = `Pad S` | `Left Y-`
D-Pad/Left = `Pad W` | `Left X-`
D-Pad/Right = `Pad E` | `Left X+`
IR/Up = `Right Y+`
IR/Down = `Right Y-`
IR/Left = `Right X-`
IR/Right = `Right X+`
Rumble/Motor = Motor
