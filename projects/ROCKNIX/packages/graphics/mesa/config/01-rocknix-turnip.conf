<?xml version="1.0"?>
<!--
  ROCKNIX additions to mesa's 00-turnip-defaults.conf.

  tu_autotune_flags: adapt corrects the GMEM/sysmem time model from measured render pass times. 
  TU_AUTOTUNE_FLAGS in the environment replaces it.
-->
<driconf>
    <device driver="turnip">
        <application name="all-default">
            <option name="tu_autotune_flags" value="adapt"/>
        </application>
    </device>
</driconf>
