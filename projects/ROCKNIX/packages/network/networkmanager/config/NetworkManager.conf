# ROCKNIX: NetworkManager owns Ethernet and Wi-Fi; Wi-Fi uses iwd as backend.

[main]
auth-polkit=false
plugins=keyfile
dhcp=internal
dns=systemd-resolved
# The hostname is system.hostname's, applied by network-base-setup. Left to
# itself NetworkManager claims a static hostname the moment it starts (ROCKNIX,
# from its own fallback), before that script has run on H700, and hostnamed
# then re-applies it over the name the player chose; which one stuck differed
# per boot (fork #106, 2026-09-10).
hostname-mode=none

[device]
wifi.backend=iwd

[keyfile]
path=/storage/.config/NetworkManager/system-connections
# ROCKNIX USB gadget not DHCP to a router.
unmanaged-devices=interface-name:gadget;interface-name:usb0;interface-name:usbnet;interface-name:rndis0
