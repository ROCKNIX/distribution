# ROCKNIX persists rfkill state on /storage: /var is tmpfs, and our
# tmpfiles entry symlinks /var/lib/systemd/rfkill to /storage/.cache/
# rfkill. systemd >= 258 sets up StateDirectory= with symlink-refusing
# semantics (openat2 RESOLVE_NO_SYMLINKS), so the unit dies at step
# STATE_DIRECTORY with ELOOP ('Too many levels of symbolic links') -
# observed on SM8250/SM8550 under 261.2. The rfkill binary itself
# hardcodes /var/lib/systemd/rfkill/ and follows the symlink fine, so
# drop the manager-side StateDirectory handling entirely.
[Service]
StateDirectory=
