[Unit]
# The archive directory is a symlink into /storage/.cache/log, made by
# systemd-tmpfiles (z_01_rocknix.conf); the stock unit is ordered only after
# the efi_pstore module and would race it, copying into a tmpfs directory
# that the symlink then replaces -- the evidence copied and lost in one boot
# (fork #104). storage-log.service creates the symlink's target.
After=systemd-tmpfiles-setup.service storage-log.service
Wants=storage-log.service
