d    /run/rocknix       0755 root root - -
d    /run/rocknix/debug 0755 root root - -
d    /storage/.cache/rfkill 0755 root root - -
L+   /var/lib/systemd/rfkill  -  -    -    - /storage/.cache/rfkill
# systemd-pstore copies a crash's kernel log out of /sys/fs/pstore into
# /var/lib/systemd/pstore, which is tmpfs here -- so the copy would die with
# the next power cycle exactly as the original would have. Point it into the
# persistent log tree (fork #104). storage-log.service creates the target.
L+   /var/lib/systemd/pstore  -  -    -    - /storage/.cache/log/pstore
