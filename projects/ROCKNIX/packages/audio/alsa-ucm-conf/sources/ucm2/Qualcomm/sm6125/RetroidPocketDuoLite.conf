Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm6125/HiFi-RetroidPocketDuoLite.conf"
	Comment "HiFi quality Music."
}

Include.wcd-init.File "/codecs/wcd937x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"

# The WCD937x reports jack and button events as SoundWire alerts on the TX
# bus, but it doesn't wake itself up, so we do that for it on card restore.
FixedBootSequence [
	sysw "-/bus/platform/devices/a470000.soundwire/power/control:on"
]

BootSequence [
	cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
	cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
