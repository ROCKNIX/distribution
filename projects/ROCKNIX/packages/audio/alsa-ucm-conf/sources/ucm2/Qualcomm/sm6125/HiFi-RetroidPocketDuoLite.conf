# Use case configuration for Retroid Pocket Duo Lite (SM6125).
# Audio paths:
#   Speaker:     MM1 -> PRI_MI2S_RX       -> AW88166 x2      (playback PCM 0)
#   Headphones:  MM2 -> RX_CODEC_DMA_RX_0 -> RX macro -> WCD937x (playback PCM 1)
#   Mic:         MM3 <- TX_CODEC_DMA_TX_3 <- TX macro DEC0 <- DMIC2    (capture PCM 2)
#   Headset Mic: MM3 <- TX_CODEC_DMA_TX_3 <- TX macro DEC0 <- WCD937x ADC2 (capture PCM 2)

SectionVerb {

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='SPK_L Speaker Switch' 1"
		cset "name='SPK_R Speaker Switch' 1"
	]

	DisableSequence [
		cset "name='SPK_L Speaker Switch' 0"
		cset "name='SPK_R Speaker Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	ConflictingDevice [
		"Speaker"
	]

	Include.wcdhpe.File "/codecs/wcd937x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd937x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Built-in Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX DMIC MUX0' DMIC2"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='TX DMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
		CaptureRate 48000
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	Include.wcdmice.File "/codecs/wcd937x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd937x/HeadphoneMicDisableSeq.conf"

	# The SM6115-style TX macro names SoundWire inputs SWR_MICn, not ADCn
	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
		CaptureRate 48000
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}
