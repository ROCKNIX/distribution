# Use case configuration for Mangmi Air X (SM6115).
# Audio path: AudioReach -> QUAT MI2S (ES8326) + SEC MI2S (AW88261)
# PCM mapping: hw:0,0 = Headphones (MM1), hw:0,1 = Speaker (MM2), hw:0,2 = Mic (MM3)
# Volume is handled by PipeWire soft-mixer (api.alsa.soft-mixer = true).

SectionVerb {

	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer QUAT_MI2S_TX' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer QUAT_MI2S_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='HPL Volume' 2"
		cset "name='HPR Volume' 2"
		cset "name='DAC Playback Volume' 191"
	]

	DisableSequence [
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "DAC"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
	]

	DisableSequence [
		cset "name='SPK_L PCM Playback Volume' 720"
		cset "name='SPK_R PCM Playback Volume' 720"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Headset Microphone Capture (ES8326)"

	EnableSequence [
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureRate 48000
	}
}

