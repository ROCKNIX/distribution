# Use case configuration for Mangmi Air X (SM6115).
# Audio paths:
#   Speaker:    MM1 -> SEC_MI2S_RX  -> AW88261 (hw:0,0)
#   Headphones: MM2 -> QUAT_MI2S_RX -> ES8326  (hw:0,1)
#   Mic:        QUAT_MI2S_TX -> MM3 -> ES8326   (hw:0,2)
# AW88261 PCM Playback Volume is inverted attenuation: 0=loudest, 720=muted.

SectionVerb {

	EnableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer QUAT_MI2S_TX' 1"
		cset "name='HPVol SPKVol Switch' 3"
		cset "name='DAC Playback Volume' 191"
	]

	DisableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer QUAT_MI2S_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='SPK_L PCM Playback Volume' 720"
		cset "name='SPK_R PCM Playback Volume' 720"
		cset "name='DAC Playback Volume' 191"
		cset "name='HPL Playback Volume' 191"
		cset "name='HPR Playback Volume' 191"
	]

	DisableSequence [
		cset "name='HPL Playback Volume' 0"
		cset "name='HPR Playback Volume' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='SPK_L PCM Playback Volume' 72"
		cset "name='SPK_R PCM Playback Volume' 72"
		cset "name='HPL Playback Volume' 0"
		cset "name='HPR Playback Volume' 0"
	]

	DisableSequence [
		cset "name='SPK_L PCM Playback Volume' 720"
		cset "name='SPK_R PCM Playback Volume' 720"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Built-in Microphone Capture"

	EnableSequence [
		cset "name='ADC Capture Volume' 191"
		cset "name='ADC PGA Gain Volume' 4"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureRate 48000
	}
}
