monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card._sys_devices_platform_sound_sound_card0*"
      }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  },
  {   
    matches = [
      {
        node.name = "~alsa_output._sys_devices_platform_sound_sound_card0*"
       }
    ]
    actions = {
      update-props = {
        priority.driver  = 1100
        priority.session = 1100
      }
    }
  }
]
