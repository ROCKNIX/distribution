<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- pipewire-pulse runs as a system service (root) on the system bus, so
     owning the PulseAudio discovery name needs an explicit policy; without
     it every boot logs "Failed to acquire org.pulseaudio.Server ...
     AccessDenied" and name-based pulse clients cannot discover the server. -->
<busconfig>
  <policy user="root">
    <allow own="org.pulseaudio.Server"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.pulseaudio.Server"/>
  </policy>
</busconfig>
