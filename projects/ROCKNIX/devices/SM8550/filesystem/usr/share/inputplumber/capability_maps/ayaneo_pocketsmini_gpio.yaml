# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
version: 2
kind: CapabilityMap
name: AYANEO Pocket S Mini GPIO Buttons
id: ayaneo_pocketsmini_gpio

mapping:
  - name: AYANEO Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_A
          value_type: button
    target_event:
      gamepad:
        button: Guide

  - name: Quick Access Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_EQUAL
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess

filtered_events: []
