# MANGMI Pocket Max: never suspend the headphone sink.
# Suspending the idle sink powers the wcd938x HPH path down and back up,
# which pops in the headphones. The speaker sink keeps the default suspend.
monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        api.alsa.path = "hw:PocketMax,0"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
