# Retroid Pocket SM8250: capture at S24 records noise while S16 is clean on
# the same route, so pin the capture node to S16LE.
monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Source"
        api.alsa.path = "hw:RetroidPocket,2"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
      }
    }
  }
]
