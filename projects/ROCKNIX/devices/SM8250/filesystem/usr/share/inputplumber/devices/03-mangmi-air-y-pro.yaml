# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: MANGMI Air Y Pro

# Both SM8250 MANGMI configs list the generic "pwm-vibrator" source, so without
# a model gate each one also matches on the other device and spawns a second,
# rumble-only composite device (and a second ds5 target).
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: MANGMI Air Y Pro

single_source: false

source_devices:
  - group: gamepad
    evdev:
      name: MANGMI Air Y Pro Joypad
      phys_path: mangmi-air-y-pro/input0
      handler: event*
    capability_map_id: air_y_pro_mcu
  - group: gamepad
    evdev:
      name: pwm-vibrator
      handler: event*

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
