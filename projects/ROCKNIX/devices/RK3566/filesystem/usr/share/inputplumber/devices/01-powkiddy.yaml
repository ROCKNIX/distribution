# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1

kind: CompositeDevice

name: Powkiddy

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Powkiddy RGB10MAX3
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Powkiddy RK2023
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Powkiddy RGB30
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Powkiddy x55
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Powkiddy x35s

maximum_sources: 2

source_devices:
  - group: gamepad
    evdev:
      name: gpio-keys-control
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: powkiddy
  - group: gamepad
    evdev:
      name: adc-joystick
      handler: event*
    capability_map_id: powkiddy

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
