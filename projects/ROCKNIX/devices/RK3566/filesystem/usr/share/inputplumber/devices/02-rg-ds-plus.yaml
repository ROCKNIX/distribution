# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1

kind: CompositeDevice

name: Anbernic RG DS Plus

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG DS Plus

maximum_sources: 5

source_devices:
  - group: gamepad
    evdev:
      name: gpio-keys-control
      handler: event*
    capability_map_id: anbernic_rgds
  - group: gamepad
    evdev:
      name: adc-joystick
      handler: event*
    capability_map_id: anbernic_rgds
  - group: gamepad
    evdev:
      name: adc-keys-home
      handler: event*
    capability_map_id: anbernic_rgds
  - group: gamepad
    evdev:
      name: pwm-vibrator
      handler: event*

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
