# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1

kind: CompositeDevice

name: Powkiddy

matches:
 - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Powkiddy x55

maximum_sources: 2

source_devices:
  - group: gamepad
    evdev:
      name: gpio-keys-control
      handler: event*
    capability_map_id: powkiddy_x55
  - group: gamepad
    evdev:
      name: adc-joystick
      handler: event*
    capability_map_id: powkiddy_x55

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
