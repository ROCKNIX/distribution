# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1

kind: CompositeDevice

name: Anbernic RGxx3

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG503
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG353M
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG353P
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG353PS
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG353V
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG353VS
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Powkiddy RGB20 Pro


maximum_sources: 4

source_devices:
  - group: gamepad
    evdev:
      name: gpio-keys-control
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: anbernic_gen1
  - group: gamepad
    evdev:
      name: adc-joystick
      handler: event*
    capability_map_id: anbernic_gen1
  - group: gamepad
    evdev:
      name: adc-keys
      phys_path: adc-keys/input0
      handler: event*
    capability_map_id: anbernic_gen1
  - group: gamepad
    evdev:
      name: pwm-vibrator
      handler: event*

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
