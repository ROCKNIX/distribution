# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1

kind: CompositeDevice

name: Powkiddy rgb20sx
# Identical to 1st gen Anbernic,
# but without vibrator
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Powkiddy RGB20SX


maximum_sources: 3

source_devices:
  - group: gamepad
    evdev:
      name: gpio-keys-control
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: anbernic_gen1
  - group: gamepad
    evdev:
      name: adc-joystick
      handler: event*
    capability_map_id: anbernic_gen1
  - group: gamepad
    evdev:
      name: adc-keys
      phys_path: adc-keys/input0
      handler: event*
    capability_map_id: anbernic_gen1

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
