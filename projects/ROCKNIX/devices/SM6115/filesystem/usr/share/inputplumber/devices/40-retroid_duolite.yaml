# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: Retroid Pocket Duo Lite
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket Duo Lite
single_source: false
source_devices:
  - group: gamepad
    evdev:
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: retroid_duolite
  - group: gamepad
    evdev:
      name: aw86927-haptics
      handler: event*
options:
  auto_manage: true
target_devices:
  - ds5
  - keyboard
