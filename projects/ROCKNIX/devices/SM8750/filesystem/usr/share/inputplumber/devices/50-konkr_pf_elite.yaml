# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: KONKR Pocket FIT Elite

# Compose this device's two input sources into one virtual controller:
#   - the AYANEO MCU SPI gamepad (kernel mcu_joystick driver, patch 0058)
#   - the 5 "system" buttons (KONKR/Home/menu/grips) from the konkr_sysbtn
#     kernel serdev driver, which reads them off the MCU UART (patch 0069)
# so applications see a single standard pad instead of two devices.
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: KONKR Pocket FIT Elite

single_source: false

source_devices:
  # Main gamepad: standard evdev layout (BTN_SOUTH.. + ABS sticks/triggers/hat),
  # so InputPlumber's built-in evdev translation handles it (no capability map).
  - group: gamepad
    evdev:
      name: AYANEO MCU Gamepad
      handler: event*
    capability_map_id: konkr_gamepad
  # System buttons: non-standard, remapped via the capability map below.
  - group: gamepad
    evdev:
      name: KONKR System Buttons
      handler: event*
    capability_map_id: konkr_sysbtn

options:
  auto_manage: true

# ds5-edge (DualSense Edge) rather than plain ds5, matching the AYN Odin 3 on
# this same platform: the Edge is the DualSense variant with back paddles, so
# this device's grip buttons can be emitted as real gamepad buttons instead of
# keyboard keys. NOT deck-uhid (hidraw-only: ES/SDL only enumerate evdev pads).
# The keyboard target stays for the remaining auxiliary buttons, which have no
# gamepad equivalent and are useful as bindable hotkeys (see the capability
# maps).
target_devices:
  - ds5
  - keyboard
