# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
version: 2
kind: CapabilityMap
name: KONKR Gamepad Mapping
id: konkr_gamepad

# The SPI gamepad's front-top-left button is BTN_MODE in hardware; the KONKR
# UART button is the device's Guide instead (konkr_sysbtn.yaml), so route
# this one to a bindable hotkey. Everything else passes through untouched.
mapping:
  - name: Front-top-left (KeyF3)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
    target_event:
      keyboard: KeyF3
