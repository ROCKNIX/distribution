# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
version: 2
kind: CapabilityMap
name: KONKR System Buttons Mapping
id: konkr_sysbtn

# The konkr_sysbtn kernel serdev driver reads the AYANEO MCU UART and emits the
# device's "system" buttons as BTN_TRIGGER_HAPPY1..5.
#
# KONKR -> Guide. The two extra shoulder buttons become the DualSense Edge's
# back-lever buttons, which is the only pair of spare gamepad-class buttons the
# ds5-edge target offers. The remaining two front buttons have no gamepad
# equivalent, so they go to keyboard F-keys and are bindable as hotkeys.
#
# The device also has two physical back buttons, but the MCU emits nothing for
# them (see the key_lc_back/key_rc_back sysfs attributes on the serdev device).
mapping:
  - name: Front-bottom-right (KeyF1)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY1
          value_type: button
    target_event:
      keyboard: KeyF1

  - name: KONKR (Guide)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY2
          value_type: button
    target_event:
      gamepad:
        button: Guide

  - name: Left extra shoulder (LeftPaddle2)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY3
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle2

  - name: Right extra shoulder (RightPaddle2)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY4
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle2

  - name: Front-top-right (KeyF2)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY5
          value_type: button
    target_event:
      keyboard: KeyF2
