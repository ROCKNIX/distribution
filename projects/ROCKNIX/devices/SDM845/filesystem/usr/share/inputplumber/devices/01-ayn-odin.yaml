# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1

kind: CompositeDevice

name: AYN Odin

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin M0
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin M2

source_devices:
  - group: gamepad
    evdev:
      name: AYN Odin Gamepad Buttons
      handler: event*
    capability_map_id: ayn_odin
  - group: gamepad
    evdev:
      name: adc-joystick
      handler: event*
  - group: gamepad
    evdev:
      name: spmi_haptics
      handler: event*

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
