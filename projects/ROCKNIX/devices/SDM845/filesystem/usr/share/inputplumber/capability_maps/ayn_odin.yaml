# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
version: 2

kind: CapabilityMap

name: AYN Odin map
# From jenneron/InputPlumber 1eb6029 (ayn_type4.yaml)
id: ayn_odin

mapping:
  - name: Dpad Up
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_UP
          value_type: button
    target_event:
      gamepad:
        button: DPadUp

  - name: Dpad Down
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_DOWN
          value_type: button
    target_event:
      gamepad:
        button: DPadDown

  - name: Dpad Left
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_LEFT
          value_type: button
    target_event:
      gamepad:
        button: DPadLeft

  - name: Dpad Right
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_RIGHT
          value_type: button
    target_event:
      gamepad:
        button: DPadRight

  # Swap North/West to match the Xbox-style layout
  - name: West Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_NORTH
          value_type: button
    target_event:
      gamepad:
        button: West

  - name: North Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_WEST
          value_type: button
    target_event:
      gamepad:
        button: North

  # Either back paddle doubles as the hotkey, like Mode.
  - name: Guide Button (Left Paddle)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY7
          value_type: button
    target_event:
      gamepad:
        button: Guide

  - name: Guide Button (Right Paddle)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY5
          value_type: button
    target_event:
      gamepad:
        button: Guide
