# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1

kind: CompositeDevice

name: AISLPC Pocket AIS

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AISLPC Pocket AIS

maximum_sources: 9

source_devices:
  - group: gamepad
    evdev:
      name: gpio-keys-control
      handler: event*
    capability_map_id: pocket_ais_map
  - group: gamepad
    evdev:
      name: adc-joystick
      handler: event*
    capability_map_id: pocket_ais_map
  - group: gamepad
    evdev:
      name: adc-keys-dpad-down
      handler: event*
    capability_map_id: pocket_ais_map
  - group: gamepad
    evdev:
      name: adc-keys-dpad-left
      handler: event*
    capability_map_id: pocket_ais_map
  - group: gamepad
    evdev:
      name: adc-keys-dpad-right
      handler: event*
    capability_map_id: pocket_ais_map
  - group: gamepad
    evdev:
      name: adc-keys-north
      handler: event*
    capability_map_id: pocket_ais_map
  - group: gamepad
    evdev:
      name: adc-keys-south
      handler: event*
    capability_map_id: pocket_ais_map
  - group: gamepad
    evdev:
      name: adc-keys-west
      handler: event*
    capability_map_id: pocket_ais_map
  - group: gamepad
    evdev:
      name: gpio-vibrator
      handler: event*

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
