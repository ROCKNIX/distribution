# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1

kind: CompositeDevice

name: Anbernic RG Vita Pro

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG Vita Pro

maximum_sources: 5

source_devices:
  - group: gamepad
    evdev:
      name: gamepad-keys
      handler: event*
    capability_map_id: rg_vita_pro_map
  - group: gamepad
    evdev:
      name: MCU Joypad
      handler: event*
    capability_map_id: rg_vita_pro_map
  - group: gamepad
    evdev:
      name: adc-keys-home
      handler: event*
    capability_map_id: rg_vita_pro_map
  - group: imu
    iio:
      name: icm42607p-accel
    config:
      imu:
        mount_matrix:
          x: [-1, 0, 0]
          y: [0, 1, 0]
          z: [0, 0, -1]
  - group: imu
    iio:
      name: icm42607p-gyro
    config:
      imu:
        mount_matrix:
          x: [-1, 0, 0]
          y: [0, 1, 0]
          z: [0, 0, -1]

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
