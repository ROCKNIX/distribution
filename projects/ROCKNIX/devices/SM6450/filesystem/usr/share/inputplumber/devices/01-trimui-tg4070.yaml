# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: TrimUI TG4070 Layout

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: TrimUI TG4070

single_source: false

source_devices:
  - group: gamepad
    evdev:
      name: TRIMUI Brick Hammer Pro U Controller
      phys_path: trimui-mcu/input0
      handler: event*
    capability_map_id: trimui_tg4070

  - group: gamepad
    evdev:
      name: gpio-keys
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: trimui_tg4070

  - group: gamepad
    evdev:
      name: pm8xxx_vib_ffmemless
      handler: event*

options:
  auto_manage: true

target_devices:
  - ds5
  - keyboard
