# Use case configuration for the TrimUI TG4070

Syntax 4

SectionUseCase."HiFi" {
	File "/TrimUI/TG4070/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='Left Profile Set' Music"
	cset "name='Right Profile Set' Music"
	cset "name='Left PCM Playback Volume' 360"
	cset "name='Right PCM Playback Volume' 360"
]

LibraryConfig.remap.Config {

	ctl.default.map {
		"name='Speaker Volume'" {
			"name='Left PCM Playback Volume'".vindex.0 0
			"name='Right PCM Playback Volume'".vindex.1 0
		}
	}
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd937x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
